name: test-windows

on:
  push:
    branches: [ dev, main ]

  workflow_dispatch:

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: True
  CONAN_REMOTE_NAME: untwine
  CONAN_REMOTE_URL: https://packages.untwine-openusd.dev/repository/conan/

  # Avoid the just-in-time debugger where possible when running tests.
  ARCH_AVOID_JIT: True

jobs:
  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: 3.12

      # Windows Defender's real-time scan of freshly-built executables can
      # stall the first run of each test binary for several minutes.
      - name: Exclude the workspace from Windows Defender scanning
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: Set up Conan
        shell: bash
        run: |
          pip install conan pytest-cmake
          conan profile detect
          conan remote add "$CONAN_REMOTE_NAME" "$CONAN_REMOTE_URL" --force

      - name: Build
        shell: bash
        run: >
          conan build .
          -o build_tests=True
          -o precompiled_headers=True
          -o python_version=3.12
          --options=*:shared=True
          -c tools.cmake.cmaketoolchain:generator="Visual Studio 18 2026"
          --build=missing

      - name: Diagnose extension module DLL imports
        shell: pwsh
        run: |
          pip install pefile
          @'
          import pefile, glob, os

          patterns = [
              "build/**/_tf.pyd", "build/**/_gf.pyd",
              "build/**/PxrTf.dll", "build/**/PxrGf.dll",
              os.path.expanduser("~/.conan2/p/**/_tf.pyd"),
              os.path.expanduser("~/.conan2/p/**/PxrTf.dll"),
              os.path.expanduser("~/.conan2/p/**/PxrArch.dll"),
              os.path.expanduser("~/.conan2/p/**/PxrBoostPython.dll"),
              os.path.expanduser("~/.conan2/p/**/tbb*.dll"),
          ]
          seen = set()
          for pattern in patterns:
              for f in glob.glob(pattern, recursive=True):
                  if f in seen:
                      continue
                  seen.add(f)
                  print("===", f, "===")
                  try:
                      pe = pefile.PE(f)
                      for entry in pe.DIRECTORY_ENTRY_IMPORT:
                          print("  imports:", entry.dll.decode())
                  except Exception as e:
                      print("  ERROR:", e)
          '@ | python -

      - name: Test
        run: ctest --preset conan-release -VV -j4 --timeout 3600
